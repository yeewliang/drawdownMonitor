name: CI/CD

# Tests everything on every push and PR. On the default branch it then deploys
# Firebase (rules, indexes, functions) and, after that, the web app to Vercel
# production. PRs get a Vercel preview. Vercel's own git builds are off
# (web/vercel.json), so nothing ships without passing tests.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FIREBASE_TOOLS: firebase-tools@15.33.0
  VERCEL_CLI: vercel@62.2.0
  VERCEL_ORG_ID: team_pT7FWt5dzw4KbbWMK9rxDwgA
  VERCEL_PROJECT_ID: prj_08438BRl6xbdazo5KbqFgz1JRG0y

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5 # Firestore emulator
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g ${{ env.FIREBASE_TOOLS }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:emulator
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy-firebase:
    needs: [functions, web]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-firebase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      # Non-secret function params (secrets live in Secret Manager). Override with repo variables.
      - name: Write functions/.env.<project>
        run: |
          set -euo pipefail
          project=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default")
          {
            echo "APP_URL=${{ vars.APP_URL || 'https://drawdown-monitor.vercel.app' }}"
            echo "SMTP_HOST=${{ vars.SMTP_HOST }}"
            echo "SMTP_PORT=${{ vars.SMTP_PORT || '587' }}"
            echo "SMTP_USER=${{ vars.SMTP_USER }}"
            echo "MAIL_FROM=${{ vars.MAIL_FROM || 'Drawdown Monitor <alerts@example.com>' }}"
          } > "functions/.env.$project"
          echo "wrote functions/.env.$project"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # --force: remove functions deleted from the source without prompting.
      - run: npx -y ${{ env.FIREBASE_TOOLS }} deploy --only firestore:rules,firestore:indexes,functions --non-interactive --force

  deploy-web:
    needs: [functions, web, deploy-firebase]
    # Production after the backend deploys on the default branch; preview for same-repo PRs.
    if: >-
      always() && needs.functions.result == 'success' && needs.web.result == 'success' &&
      ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && needs.deploy-firebase.result == 'success') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: |
          set -euo pipefail
          PROD=$([ "$TARGET" = production ] && echo --prod || true)
          npx -y "$VERCEL_CLI" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
          npx -y "$VERCEL_CLI" build $PROD --token="$VERCEL_TOKEN"
          url=$(npx -y "$VERCEL_CLI" deploy --prebuilt $PROD --token="$VERCEL_TOKEN")
          echo "Deployed $TARGET: $url" | tee -a "$GITHUB_STEP_SUMMARY"
